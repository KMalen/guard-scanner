services:
  code-guardian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: guard-scanner
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MONGODB_URI=${MONGODB_URI}
      - QUEUE_HOST=${QUEUE_HOST}
      - QUEUE_PORT=${QUEUE_PORT}
    depends_on:
      - mongodb
      - redis
    deploy:
      resources:
        limits:
          memory: 200M
    restart: unless-stopped

  mongodb:
    image: mongo
    container_name: guard-mongodb
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis
    container_name: guard-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data: